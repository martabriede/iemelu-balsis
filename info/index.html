<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#8F1730">
  <title>Ziemeļu Balsis — Kora ziņas</title>

  <style>
    :root{
      --bg:#FFFBFC;
      --text:#182033;
      --muted:#5f6b7d;
      --brand:#8F1730;
      --brand-dark:#651020;
      --card:#ffffff;
      --border:#F0DDE2;
      --tint:#FFF3F6;
      --shadow:0 18px 45px rgba(112,20,39,.10),0 4px 14px rgba(15,23,42,.06);
      --shadow-soft:0 10px 28px rgba(112,20,39,.08),0 2px 8px rgba(15,23,42,.05);
      --radius:24px;
      --maxw:820px;
    }

    *{box-sizing:border-box}
    html,body{
      margin:0;padding:0;background:var(--bg);color:var(--text);
      font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    body{
      min-height:100dvh;
      background:
        radial-gradient(circle at 85% 8%,rgba(143,23,48,.08),transparent 28rem),
        linear-gradient(180deg,#fff 0%,#fff7f9 100%);
    }

    .topbar{
      background-color:var(--brand);
      color:#fff;
      background-image:
        repeating-linear-gradient(45deg,rgba(255,255,255,.12) 0px,rgba(255,255,255,.12) 2px,transparent 2px,transparent 6px),
        repeating-linear-gradient(-45deg,rgba(255,255,255,.12) 0px,rgba(255,255,255,.12) 2px,transparent 2px,transparent 6px);
      background-size:16px 16px;
      background-blend-mode:overlay;
      box-shadow:0 8px 24px rgba(101,16,32,.20);
    }

    .topbar-inner{
      max-width:var(--maxw);
      margin:0 auto;
      padding:1rem 1.1rem;
      display:flex;
      align-items:center;
      gap:.75rem;
    }

    .logo{
      width:46px;height:46px;object-fit:contain;border-radius:12px;
    }

    .brand-title{font-size:1.05rem;font-weight:850;letter-spacing:.01em}
    .brand-subtitle{font-size:.82rem;opacity:.86;margin-top:.05rem}

    main{
      max-width:var(--maxw);
      margin:0 auto;
      padding:1.35rem 1rem 4rem;
    }

    .intro{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:1rem;
      margin-bottom:1rem;
    }

    h1{
      margin:0;
      font-size:clamp(1.7rem,5vw,2.3rem);
      line-height:1.15;
    }

    h1::after{
      content:"";
      display:block;
      width:64px;height:5px;
      margin-top:.55rem;
      border-radius:999px;
      background:var(--brand);
    }

    .updated{
      color:var(--muted);
      font-size:.82rem;
      text-align:right;
      white-space:nowrap;
    }

    .hero-card,.feed-card{
      background:rgba(255,255,255,.96);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow-soft);
    }

    .hero-card{
      padding:1.25rem;
      margin-bottom:1.3rem;
      position:relative;
      overflow:hidden;
    }

    .hero-card::before{
      content:"";
      position:absolute;
      inset:0 auto 0 0;
      width:6px;
      background:var(--brand);
    }

    .eyebrow{
      color:var(--brand);
      font-size:.78rem;
      font-weight:850;
      text-transform:uppercase;
      letter-spacing:.08em;
      margin-bottom:.5rem;
    }

    .hero-card h2{
      margin:.1rem 0 .7rem;
      font-size:1.55rem;
      line-height:1.25;
    }

    .date-main{
      color:var(--brand);
      font-weight:850;
      font-size:1rem;
      margin:.35rem 0;
    }

    .details{
      display:grid;
      gap:.65rem;
      margin-top:.85rem;
    }

    .detail{
      border-top:1px solid var(--border);
      padding-top:.65rem;
    }

    .detail:first-child{border-top:0;padding-top:0}

    .detail-label{
      display:block;
      color:var(--muted);
      font-size:.76rem;
      font-weight:850;
      text-transform:uppercase;
      letter-spacing:.06em;
      margin-bottom:.15rem;
    }

    .description{
      margin-top:.9rem;
      padding:.9rem 1rem;
      background:var(--tint);
      border:1px solid var(--border);
      border-radius:18px;
      white-space:pre-wrap;
    }

    .section-heading{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:.7rem;
      margin:1.55rem 0 .75rem;
    }

    .section-heading h2{font-size:1.12rem;margin:0}

    .count{
      color:var(--muted);
      border:1px solid var(--border);
      background:#fff;
      border-radius:999px;
      padding:.18rem .55rem;
      font-size:.8rem;
    }

    .feed{display:grid;gap:.85rem}

    .feed-card{padding:1rem}
    .feed-card h3{margin:.08rem 0 .4rem;font-size:1.08rem;line-height:1.35}
    .feed-date{color:var(--brand);font-weight:850;font-size:.88rem}
    .compact{color:var(--muted);font-size:.89rem;margin-top:.25rem}

    details{margin-top:.7rem}
    summary{
      cursor:pointer;
      color:var(--brand);
      font-weight:800;
      user-select:none;
    }

    .archive-toggle{
      width:100%;
      text-align:left;
      padding:.9rem 1rem;
      border:1px solid var(--border);
      border-radius:18px;
      background:#fff;
      color:var(--brand);
      font:inherit;
      font-weight:800;
      cursor:pointer;
      box-shadow:var(--shadow-soft);
    }

    .archive{display:none;margin-top:.8rem}
    .archive.open{display:grid}

    .status{
      text-align:center;
      color:var(--muted);
      padding:2.5rem 1rem;
    }

    .error{
      padding:1rem;
      border:1px solid #fecaca;
      background:#fff5f5;
      color:#991B1B;
      border-radius:18px;
    }

    a{color:var(--brand);overflow-wrap:anywhere}

    .posted{
      color:var(--muted);
      font-size:.75rem;
      margin-top:.9rem;
    }

    @media(max-width:560px){
      .intro{flex-direction:column;align-items:flex-start}
      .updated{text-align:left}
      .hero-card{padding:1.05rem}
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="topbar-inner">
      <img class="logo" src="../images/logo.png" alt="Ziemeļu Balsis logo">
      <div>
        <div class="brand-title">Ziemeļu Balsis</div>
        <div class="brand-subtitle">Kora dalībnieku ziņas</div>
      </div>
    </div>
  </header>

  <main>
    <div class="intro">
      <h1>Kas aktuāls?</h1>
      <div class="updated" id="updated"></div>
    </div>

    <div id="app">
      <div class="status">Ielādējam kora ziņas…</div>
    </div>
  </main>

  <script>
    /*
      SUPER-MVP GOOGLE SHEETS CONNECTION
      Spreadsheet:
      https://docs.google.com/spreadsheets/d/1TsUo-NbYTQhAajWZ0jHDjds1dHozQ7HJMs_E4S7Sz2E/

      gid=0 means the first sheet/tab in that spreadsheet.
      If you later move the newsfeed to another tab, update SHEET_GID.
    */
    const SPREADSHEET_ID = "1TsUo-NbYTQhAajWZ0jHDjds1dHozQ7HJMs_E4S7Sz2E";
    const SHEET_GID = "0";

    const REQUIRED_HEADERS = [
      "Date of posting",
      "Title",
      "Date of event",
      "Time of event",
      "Location",
      "Description",
      "Dresscode",
      "Useful links",
      "Notes from org/conductors"
    ];

    function escapeHtml(value){
      return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function linkify(value){
      const safe = escapeHtml(value);
      return safe.replace(
        /(https?:\/\/[^\s<]+)/g,
        '<a href="$1" target="_blank" rel="noopener">$1</a>'
      );
    }

    // Google Visualization may send Sheet dates as Date(2026,7,17).
    // Note: the month is zero-based in that format.
    function parseGoogleDate(raw, formatted){
      if(raw instanceof Date) return raw;

      const value = String(raw ?? "").trim();
      const googleDate = value.match(/^Date\((\d{4}),(\d{1,2}),(\d{1,2})/);
      if(googleDate){
        return new Date(
          Number(googleDate[1]),
          Number(googleDate[2]),
          Number(googleDate[3]),
          12,0,0
        );
      }

      // Reliable fallback if admin enters YYYY-MM-DD as plain text.
      const isoSource = value || String(formatted ?? "").trim();
      const iso = isoSource.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if(iso){
        return new Date(Number(iso[1]), Number(iso[2])-1, Number(iso[3]), 12,0,0);
      }

      const candidate = new Date(isoSource);
      return Number.isNaN(candidate.getTime()) ? null : candidate;
    }

    function dateLabel(dateObj, fallback){
      if(!dateObj) return fallback || "";
      return new Intl.DateTimeFormat("lv-LV",{
        day:"numeric",
        month:"long",
        year:"numeric"
      }).format(dateObj);
    }

    function startToday(){
      const d = new Date();
      d.setHours(0,0,0,0);
      return d;
    }

    function detail(label, value){
      if(!String(value ?? "").trim()) return "";
      return `
        <div class="detail">
          <span class="detail-label">${escapeHtml(label)}</span>
          <div>${linkify(value)}</div>
        </div>
      `;
    }

    function renderHero(item){
      return `
        <article class="hero-card">
          <div class="eyebrow">🎵 Nākamais notikums</div>
          <h2>${escapeHtml(item["Title"] || "Kora notikums")}</h2>

          <div class="date-main">
            ${escapeHtml(dateLabel(item._eventDate, item["Date of event"]))}
            ${item["Time of event"] ? " · " + escapeHtml(item["Time of event"]) : ""}
          </div>

          <div class="details">
            ${detail("Vieta", item["Location"])}
          </div>

          ${item["Description"] ? `<div class="description">${linkify(item["Description"])}</div>` : ""}

          <div class="details">
            ${detail("Dresscode", item["Dresscode"])}
            ${detail("Noderīgas saites", item["Useful links"])}
            ${detail("Organizatoru / diriģentu piezīmes", item["Notes from org/conductors"])}
          </div>

          ${item["Date of posting"] ? `<div class="posted">Publicēts: ${escapeHtml(item["Date of posting"])}</div>` : ""}
        </article>
      `;
    }

    function renderFeedCard(item){
      const hasDetails =
        item["Description"] ||
        item["Dresscode"] ||
        item["Useful links"] ||
        item["Notes from org/conductors"];

      return `
        <article class="feed-card">
          <div class="feed-date">
            ${escapeHtml(dateLabel(item._eventDate, item["Date of event"]))}
            ${item["Time of event"] ? " · " + escapeHtml(item["Time of event"]) : ""}
          </div>

          <h3>${escapeHtml(item["Title"] || "Kora notikums")}</h3>

          ${item["Location"] ? `<div class="compact">📍 ${escapeHtml(item["Location"])}</div>` : ""}

          ${hasDetails ? `
            <details>
              <summary>Skatīt vairāk</summary>
              ${item["Description"] ? `<div class="description">${linkify(item["Description"])}</div>` : ""}
              <div class="details">
                ${detail("Dresscode", item["Dresscode"])}
                ${detail("Noderīgas saites", item["Useful links"])}
                ${detail("Organizatoru / diriģentu piezīmes", item["Notes from org/conductors"])}
              </div>
              ${item["Date of posting"] ? `<div class="posted">Publicēts: ${escapeHtml(item["Date of posting"])}</div>` : ""}
            </details>
          ` : ""}
        </article>
      `;
    }

    function render(items){
      const today = startToday();

      const dated = items
        .filter(item => String(item["Title"] ?? "").trim() !== "")
        .map(item => ({
          ...item,
          _eventDate: parseGoogleDate(item.__rawDateOfEvent, item["Date of event"])
        }));

      const future = dated
        .filter(item => item._eventDate && item._eventDate >= today)
        .sort((a,b) => a._eventDate - b._eventDate);

      const undated = dated
        .filter(item => !item._eventDate);

      const past = dated
        .filter(item => item._eventDate && item._eventDate < today)
        .sort((a,b) => b._eventDate - a._eventDate);

      const hero = future[0] || undated[0] || null;
      const upcoming = hero
        ? [...future.slice(hero === future[0] ? 1 : 0), ...undated.filter(x => x !== hero)]
        : [...future, ...undated];

      let html = "";

      if(hero){
        html += renderHero(hero);
      } else {
        html += `<div class="status">Pašlaik nav pievienotu nākamo notikumu.</div>`;
      }

      if(upcoming.length){
        html += `
          <div class="section-heading">
            <h2>Turpmākie notikumi</h2>
            <span class="count">${upcoming.length}</span>
          </div>
          <div class="feed">
            ${upcoming.map(renderFeedCard).join("")}
          </div>
        `;
      }

      if(past.length){
        html += `
          <div class="section-heading">
            <h2>Iepriekšējie notikumi</h2>
          </div>
          <button class="archive-toggle" id="archiveToggle" type="button">
            Parādīt iepriekšējos notikumus (${past.length})
          </button>
          <div class="feed archive" id="archive">
            ${past.map(renderFeedCard).join("")}
          </div>
        `;
      }

      document.getElementById("app").innerHTML = html;

      const toggle = document.getElementById("archiveToggle");
      const archive = document.getElementById("archive");
      if(toggle && archive){
        toggle.addEventListener("click",()=>{
          const open = archive.classList.toggle("open");
          toggle.textContent = open
            ? "Paslēpt iepriekšējos notikumus"
            : `Parādīt iepriekšējos notikumus (${past.length})`;
        });
      }

      document.getElementById("updated").textContent =
        "Ielādēts " +
        new Intl.DateTimeFormat("lv-LV",{hour:"2-digit",minute:"2-digit"}).format(new Date());
    }

    // This function is called directly by Google's gviz endpoint.
    window.handleSheetData = function(response){
      try{
        if(!response || response.status === "error"){
          throw new Error("Google Sheets returned an error.");
        }

        const table = response.table;
        const headers = table.cols.map(col => String(col.label || "").trim());

        const missing = REQUIRED_HEADERS.filter(h => !headers.includes(h));
        if(missing.length){
          throw new Error("Missing columns: " + missing.join(", "));
        }

        const rows = table.rows.map(row => {
          const obj = {};
          row.c.forEach((cell,index)=>{
            const header = headers[index];
            if(!header) return;

            const raw = cell ? cell.v : "";
            const formatted = cell && cell.f != null ? cell.f : raw;

            obj[header] = formatted ?? "";

            if(header === "Date of event"){
              obj.__rawDateOfEvent = raw;
            }
          });
          return obj;
        });

        render(rows);
      }catch(err){
        console.error(err);
        document.getElementById("app").innerHTML = `
          <div class="error">
            Neizdevās nolasīt Google Sheet datus.<br><br>
            ${escapeHtml(err.message)}
          </div>
        `;
      }
    };

    window.handleSheetLoadError = function(){
      document.getElementById("app").innerHTML = `
        <div class="error">
          Neizdevās pieslēgties Google Sheet. Pārbaudi, vai fails ir pieejams
          skatīšanai ar saiti (“Anyone with the link — Viewer”).
        </div>
      `;
    };

    // JSONP-style script loading avoids the need for Apps Script or an API key.
    const script = document.createElement("script");
    script.src =
      `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq` +
      `?gid=${encodeURIComponent(SHEET_GID)}` +
      `&headers=1` +
      `&tqx=responseHandler:handleSheetData`;
    script.onerror = window.handleSheetLoadError;
    document.body.appendChild(script);
  </script>
</body>
</html>
